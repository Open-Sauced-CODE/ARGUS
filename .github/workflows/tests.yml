name: CI Tests

on:
  push:
    branches: [ main, docs/polish ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Hermetic Unit & Policy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hermetic test suites
        run: |
          # Runs offline risk, privacy, and documentation contract tests.
          # These suites run hermetically without requiring AWS credentials, Neo4j, Ollama, or GPU.
          pytest risk/tests privacy/tests ml/tests/test_contracts_doc.py -q
