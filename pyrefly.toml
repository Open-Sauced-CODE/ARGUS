# pyrefly.toml — Pyrefly type-checker configuration for ARGUS
# Docs: https://pyrefly.org/en/stable/configuration/

python-interpreter-path = ".venv/Scripts/python.exe"
use-ignore-files = true

project-includes = [
    "risk/**",
    "prioritize/**",
    "privacy/**",
    "ml/**",
    "backend/**",
    "graph/**",
    "remediate/**",
    "verify/**",
]

project-excludes = [
    "**/tests/**",
    "**/notebooks/**",
    "**/node_modules/**",
    "**/.venv/**",
    "**/argus-venv/**",
    "**/cloudgoat/**",
    "**/.ruff_cache/**",
    "**/.mypy_cache/**",
    "**/.pytest_cache/**",
]

